id: foundation
name: Foundation
owner: PM
purpose: >-
  Fix the ground rules the system must build within: the architecture file
  and the glossary. Entered from Define, never directly.
trigger: Define sorts a request as needing the foundation, either because no architecture file exists yet or because the request needs a tool, language or rule the architecture does not allow
steps:
  - id: new-or-change
    type: decision
    title: New product or rule change?
    owner: AI
    what: >-
      Picks the case from the request's change record: no architecture file
      yet means a new product; otherwise one rule of an existing product
      must change and be checked against the code already built.
    notes: >-
      Every step of this workflow writes its output to disk before the next
      step starts. When in doubt (a file exists but is empty or belongs to
      another product), the AI treats it as a rule change, never as a fresh
      start that could overwrite an existing file, and says so.
    next:
      - to: architecture
        when: new product, no architecture file yet
      - to: propose-rule
        when: rule change on an existing product

  - id: architecture
    type: step
    title: Write the architecture file
    input: >-
      The architecture file, written or pasted by the PM. On a later pass:
      the file revised for the findings, a finding marked "accepted as is",
      "the foundation is not needed after all", or "stop".
    output: The file as written, and the PM's accepted findings, in the record
    what: >-
      PM writes or pastes the architecture file. It must cover: the tools,
      language and resources the system builds with; the rules (including
      security, accessibility and performance rules, which are otherwise
      never checked); how the product is run; the systems the product has
      (frontends, backends, services) and the folder and component
      convention for each; the environments; where environment variables
      and secrets live and how the PM supplies them; and the things the
      system must never do (files never to touch, actions never to take).
      It is not generated by the system; it can be copied from elsewhere.
    next: [check]

  - id: check
    type: decision
    title: Architecture file complete and consistent?
    owner: AI
    output: Findings the PM must resolve, written into the record, if any; a decision entry for each finding the PM accepted as is
    what: >-
      A second, independent AI pass reads the file for the required content
      above, internal contradictions, tools the AI cannot actually reach,
      and content that belongs to another product. Findings go back to the
      PM with the file; a finding the PM has marked "accepted as is" is not
      reported again and is logged as a decision with the PM's reason. The
      PM's "not needed" or "stop" is routed here.
    notes: >-
      When in doubt whether something is a finding, it is reported; the PM
      can accept it as is. A check that finds nothing on a first-time file
      is run once more with a different framing (as the builder who must
      run it; as the reviewer looking for what is missing).
    next:
      - to: architecture
        when: findings the PM must resolve
      - to: glossary
        when: complete and consistent
      - to: not-needed
        when: PM says the foundation is not needed after all
      - to: drop
        when: PM stops

  - id: glossary
    type: step
    title: Write the glossary
    input: The product's terms, one meaning each, from the PM
    what: >-
      PM lists the terms and things the product deals with, one meaning
      each, so every piece of business logic uses the same words. A later
      change to a term's meaning is a cross-cutting logic change, made in
      Define.
    next: [save]

  - id: save
    type: step
    title: Save the foundation
    owner: AI
    output: Architecture file and glossary, saved with history; one decision entry per rule that had an alternative (hosting, data store, auth, framework), category by what it governs
    what: >-
      Architecture file and glossary are saved with their history. Every
      rule in the file that was chosen over an alternative becomes a
      decision entry with the PM's reason, so a later rule change brings
      the original reason forward; a rule with nothing weighed against it
      stays only in the file.
    next: [foundation-only]

  - id: foundation-only
    type: decision
    title: Was the request the foundation itself?
    owner: AI
    what: >-
      The very first request of a product is often "here is the
      architecture"; then there is nothing to discuss and the record is
      closed as delivered. Otherwise the request that needed the foundation
      continues.
    next:
      - to: done
        when: the request was the foundation itself
      - to: ready
        when: the request still needs logic

  - id: ready
    type: handoff
    title: Return to the discussion
    output: The record, the architecture file and the glossary, handed to Define
    what: The discussion continues with these as its inputs.
    to: define.discuss
    next: [done]

  - id: propose-rule
    type: step
    title: Propose the changed rule
    input: >-
      The changed rule, written by the PM. On a later pass: the rule
      revised for the findings, a finding marked "accepted as is", "not
      needed after all", or "stop".
    output: A proposed rule, unsaved, written into the record, alongside the active decision it would alter
    what: >-
      PM writes the changed rule. Before anything else the AI brings forward
      the active decision behind the current rule: its situation, decision
      and reasons, side by side with the proposal. It is a proposal, not
      yet part of the architecture file: it is written into the file only
      when the delivery that satisfies it is accepted, and discarded if
      that delivery is dropped.
    next: [check-rule]

  - id: check-rule
    type: decision
    title: Proposed rule consistent with the file?
    owner: AI
    output: Findings the PM must resolve, written into the record, if any
    what: >-
      A second, independent AI pass checks the proposal against the rest of
      the architecture file: contradictions, tools the AI cannot reach,
      required content it would remove. A finding the PM has marked
      "accepted as is" is not reported again. The PM's "not needed" or
      "stop" is routed here.
    notes: >-
      When in doubt whether something is a finding, it is reported. A check
      that finds nothing on a rule that touches existing code is run once
      more with a different framing.
    next:
      - to: propose-rule
        when: findings the PM must resolve
      - to: impact
        when: consistent
      - to: not-needed
        when: PM says the rule is not needed after all
      - to: drop
        when: PM stops

  - id: impact
    type: handoff
    title: Send the proposal for an impact check
    output: The proposed rule in the record, handed to Deliver
    what: >-
      Delivery finds every piece of code the rule touches and returns a
      plain-language plan; the PM decides there whether to apply the rule,
      revise it, or drop it. Once applied, or if it is dropped, the record
      continues in Define.
    to: deliver.trace
    next: [done]

  - id: not-needed
    type: handoff
    title: Continue without a foundation change
    output: The record, unchanged foundation, handed back to Define
    what: The discussion continues within the current rules.
    to: define.discuss
    next: [done]

  - id: drop
    type: step
    title: Drop the request
    owner: AI
    output: Change record marked dropped; unsaved file or proposal discarded; dependants returned to waiting
    what: Nothing was saved; the record is closed as dropped.
    next: [dropped]

  - id: dropped
    type: end
    title: Request dropped

  - id: done
    type: end
    title: Foundation handled
