# Workflow of workflows. See SCHEMA.md.
# entry: where the PM's input enters the whole system. exit: where the finished result leaves it.
entry: define.intake
exit: deliver.done
groups:
  - id: foundation
    name: Foundation
    workflows: [foundation]
  - id: business-side
    name: Business side
    workflows: [define]
  - id: delivery
    name: Delivery
    workflows: [deliver]
