<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow Studio</title>
<!-- No external requests: the page must render offline and unchanged. IBM Plex is used only if installed locally. -->
<style>
:root{
  --paper:#F6F7F5; --panel:#FFFFFF; --ink:#1B2430; --ink-2:#4B5563; --ink-3:#8A94A3;
  --line:#D9DEE3; --line-2:#EDF0F2;
  --accent:#0E7C7B; --accent-soft:#D9EFEE;
  --decision:#B4620A; --decision-soft:#F9E8D2;
  --handoff:#5B3FBF; --handoff-soft:#E6E0F8;
  --end:#5E6B7A; --end-soft:#E5E9ED;
  --sel:#0E7C7B; --pm:#C2410C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141920; --panel:#1B222B; --ink:#E8ECF0; --ink-2:#B4BDC8; --ink-3:#77818E;
    --line:#2C3541; --line-2:#222A34;
    --accent:#3FB5B0; --accent-soft:#173A39;
    --decision:#E39A45; --decision-soft:#3E2A14;
    --handoff:#A28CF0; --handoff-soft:#2A2247;
    --end:#9AA6B4; --end-soft:#2A323C;
    --sel:#3FB5B0; --pm:#F0894F;
  }
}
:root[data-theme="dark"]{
  --paper:#141920; --panel:#1B222B; --ink:#E8ECF0; --ink-2:#B4BDC8; --ink-3:#77818E;
  --line:#2C3541; --line-2:#222A34;
  --accent:#3FB5B0; --accent-soft:#173A39;
  --decision:#E39A45; --decision-soft:#3E2A14;
  --handoff:#A28CF0; --handoff-soft:#2A2247;
  --end:#9AA6B4; --end-soft:#2A323C;
  --sel:#3FB5B0; --pm:#F0894F;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;display:grid;grid-template-columns:240px 1fr 320px;grid-template-rows:48px 1fr;overflow:hidden}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
header{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em}
header .crumb{color:var(--ink-3)}
header .crumb b{color:var(--ink);font-weight:500}
header .spacer{flex:1}
header button{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
header button:hover{border-color:var(--ink-3)}
header button:focus-visible,.wf:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
nav{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 0}
nav .g{padding:10px 16px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.wf{display:block;width:100%;text-align:left;font:inherit;padding:6px 16px;border:0;background:none;color:var(--ink);cursor:pointer}
.wf:hover{background:var(--line-2)}
.wf.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.wf small{display:block;color:var(--ink-3);font-size:12px}
nav .empty{padding:12px 16px;color:var(--ink-3);font-size:13px;line-height:1.5}
main{position:relative;overflow:hidden}
svg#canvas{width:100%;height:100%;display:block;cursor:grab}
svg#canvas:active{cursor:grabbing}
.node{cursor:pointer}
.node rect,.node polygon{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.node.step rect{stroke:var(--accent)}
.node.decision polygon{stroke:var(--decision);fill:var(--decision-soft)}
.node.handoff rect{stroke:var(--handoff);stroke-dasharray:5 3;fill:var(--handoff-soft)}
.node.end rect{stroke:var(--end);fill:var(--end-soft)}
.node.entry rect{stroke-width:2}
.node.selected rect,.node.selected polygon{stroke:var(--sel);stroke-width:2.4}
.node text{fill:var(--ink);font-size:13px;font-family:inherit;pointer-events:none}
.node text.id{fill:var(--ink-3);font-size:10.5px;font-family:"IBM Plex Mono",monospace}
.badge rect{rx:3;stroke:none}
.badge text{font-size:9px;font-weight:600;letter-spacing:.08em;fill:#fff;dominant-baseline:middle;text-anchor:middle}
.node .badge.entry rect{fill:var(--ink-2);stroke:none} .node .badge.exit rect{fill:var(--ink-2);stroke:none}
.node .badge.pm rect{fill:var(--pm);stroke:none} .node .badge.out rect{fill:var(--accent);stroke:none}
.node.pmowned rect,.node.pmowned polygon{stroke-width:2}
.node.pmowned .stripe{fill:var(--pm);stroke:none}
.node.wf rect{fill:var(--panel);stroke:var(--accent);rx:8}
.node.wf text.n{font-weight:600}
.node.wf text.sub{fill:var(--ink-2);font-size:11.5px}
.edge path{fill:none;stroke:var(--ink-3);stroke-width:1.4}
.edge.hand path{stroke:var(--handoff);stroke-dasharray:5 3}
.edge text{fill:var(--ink-2);font-size:11px;font-family:inherit;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.cluster rect{fill:none;stroke:var(--line);stroke-dasharray:4 4;rx:12}
.term rect{fill:var(--pm);stroke:none;rx:16} .term.exit rect{fill:var(--end)}
.term text{fill:#fff;font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:middle}
.term text.sub{font-weight:400;font-size:10.5px;opacity:.9}
.edge.io path{stroke:var(--pm);stroke-width:1.8} .edge.io.exit path{stroke:var(--end)}
.cluster text{fill:var(--ink-3);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.legend{position:absolute;left:12px;bottom:12px;display:flex;gap:14px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border:1.5px solid;vertical-align:-2px;margin-right:5px;border-radius:2px}
.legend .s i{border-color:var(--accent)} .legend .d i{border-color:var(--decision);background:var(--decision-soft);transform:rotate(45deg) scale(.8)}
.legend .h i{border-color:var(--handoff);background:var(--handoff-soft);border-style:dashed} .legend .e i{border-color:var(--end);background:var(--end-soft);border-radius:8px}
.legend .pm i{border-color:var(--pm);background:var(--pm)} .legend .sep{width:1px;background:var(--line);margin:0 2px}
.legend b{font-weight:600;font-size:9px;letter-spacing:.08em;color:#fff;background:var(--ink-2);padding:1px 4px;border-radius:3px;margin-right:4px}
.hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);text-align:center;padding:40px;line-height:1.6}
.hint b{color:var(--ink-2);font-weight:500}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:18px 20px}
aside h2{font-size:16px;margin:0 0 2px;text-wrap:balance}
aside .tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-bottom:12px}
.tag.step{color:var(--accent);background:var(--accent-soft)} .tag.decision{color:var(--decision);background:var(--decision-soft)}
.tag.handoff{color:var(--handoff);background:var(--handoff-soft)} .tag.end{color:var(--end);background:var(--end-soft)}
aside dl{margin:0;display:grid;grid-template-columns:1fr;gap:12px}
aside dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
aside dd{margin:0;color:var(--ink);white-space:pre-wrap;max-width:60ch}
aside dd.notes{color:var(--ink-2);border-left:2px solid var(--line);padding-left:10px}
aside ul{margin:0;padding-left:18px} aside li{margin:2px 0}
aside a{color:var(--accent);cursor:pointer;text-decoration:underline dotted}
aside .muted{color:var(--ink-3)}
@media (prefers-reduced-motion:no-preference){ .node rect,.node polygon{transition:stroke-width .12s} }
/* narrow screens: stack header / workflow strip / canvas / inspector instead of three columns */
@media (max-width:900px){
  body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr minmax(0,38vh)}
  header{grid-column:1;flex-wrap:wrap;gap:8px 12px;padding:8px 16px;min-height:48px}
  header .crumb{flex-basis:100%;order:3;font-size:12px}
  nav{border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;padding:6px 8px}
  nav .g{padding:4px 8px;flex-basis:100%}
  .wf{width:auto;padding:4px 8px;border-radius:6px} .wf small{display:inline;margin-left:6px}
  main{min-height:280px}
  .legend{gap:8px;flex-wrap:wrap;right:12px;font-size:11px}
  aside{border-left:0;border-top:1px solid var(--line);padding:12px 16px}
}
</style>

</head>
<body>
<header>
  <h1>Workflow Studio</h1>
  <span class="crumb" id="crumb"></span>
  <span class="spacer"></span>
  <button id="btnMap">All workflows</button>
  <button id="btnFit">Fit</button>
</header>
<nav id="nav"></nav>
<main>
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg"><g id="view"></g></svg>
  <div class="legend" id="legend" hidden>
    <span class="s"><i></i>step</span><span class="d"><i></i>decision</span><span class="h"><i></i>handoff</span><span class="e"><i></i>end</span><span class="sep"></span><span class="pm"><i></i>PM provides input</span><span><b>ENTRY</b>first step</span><span><b>EXIT</b>end or handoff</span>

</main>
<aside id="inspector"></aside>

g code.", "trigger": "A change record arrives from Define (approved logic, or a fix) or from Foundation (a proposed rule)", "steps": [{"id": "trace", "type": "step", "title": "Trace the affected code and reusable components", "output": "The list of affected code (new or existing) and of existing components that can be reused, written into the record", "what": "The AI reads the architecture file (systems, structure, rules), then compares the business side with the last delivered version. For a node or node set, it finds every piece of code tagged with those ids: brand-new if nothing is tagged yet, otherwise an edit. For a bug, it starts from the node id and the violated criterion in the record; for a patch or refactor, from what changes underneath and the code that uses it. For a proposed rule, it reads every tagged piece against the rule. In every case it also searches the existing components for ones that already do part of the job, so nothing is written twice.", "notes": "Node impact comes from the tags, never guessed; rule impact comes from reading the code against the rule. Every step of this workflow writes its output to disk before the next step starts.", "next": ["plan"]}, {"id": "plan", "type": "step", "title": "Write the change plan in plain language", "output": "In the record: the plan section (for the PM) and the AI section (task list and sources), kept apart under their own headings", "what": "Plan section, for the PM, no code inside: what will change for the user, what will not change, the logic delta for a change, what happens to any existing stored data, which existing components are reused and which new ones are created (by their plain names), anything the PM must supply before work can start (a key, an account, a file), any active decision this plan would alter (brought forward with its situation and reasons), and that the result will be verified against the confirmed acceptance criteria of every node it touches; in the small lane this is one paragraph. AI section: the task list in the form \"- [ ] T001 [P] [node-id] what, in which file\", grouped in the phases Setup, Foundational, one phase per node, Polish, where [P] marks a task that touches different files from every unfinished task and can run alongside them; and, per tool choice, the current documentation consulted as Decision / Rationale / Alternatives with sources, so the code is built the way those tools are used today, not from memory.", "notes": "Optional diagram (convention): when the architecture file names archify as a tool, the plan also renders docs/architecture.archify.json to docs/architecture.html and, for a change that touches components, an Architecture Delta of before and after, linked from the plan section; the diagram is an aid for the PM at approve-plan, never a gate input, and its absence is not a finding.", "next": ["challenge-plan"]}, {"id": "challenge-plan", "type": "step", "title": "Challenge the plan", "output": "A findings section in the record (what was found and how it was fixed)", "what": "A second, independent AI pass reads the record, the node(s), the traced code and the components, and reports: anything the plan promises that the node and the tags do not justify; anything affected that the plan omits; a new component that duplicates an existing one; sources that are missing or outdated; a coverage table with one row per acceptance criterion (criterion, has a task, task ids) where an empty row is a finding; a plan that alters an active decision without bringing it forward; and any code words in the plan section. Findings are fixed before the PM sees it.", "notes": "Non-trivial means the change touches existing code or more than one criterion. A challenge that finds nothing on non-trivial work is run once more with a different framing (as the user of the changed flow; as the owner of the components touched); in the small lane it runs once. When the record returns here after a revision, the challenge reads only the delta since its last pass plus what it touches.", "next": ["approve-plan"]}, {"id": "approve-plan", "type": "decision", "title": "PM approves the plan?", "owner": "PM", "input": "PM's answer: execute (supplying anything the plan asked for); revise the plan; revise the logic; revise the rule; or drop", "output": "The answer, written into the record; on execute, a decision entry for the plan and for each AI choice inside it that adds a dependency or a stored data shape, superseding any earlier decision the PM chose to change; before the answer is taken the AI repeats the decision-log search on the components the plan touches, and a hit not already in the findings blocks the gate and returns to challenge-plan", "what": "PM reads the plan section and answers. \"Revise the plan\" is for a defect in the plan (a wrong word, something forgotten, an empty case); \"revise the logic\" is for a change in what the product should do and goes to the business side first, never straight into code. \"Revise the rule\" applies only to a rule record; \"revise the logic\" only to a logic or fix record.", "next": [{"to": "execute", "when": "yes, execute"}, {"to": "plan", "when": "the plan needs revising (the logic and the rule stand)"}, {"to": "back-to-define", "when": "the business logic needs revising"}, {"to": "back-to-foundation", "when": "the proposed rule needs revising"}, {"to": "drop", "when": "no, drop this change"}]}, {"id": "execute", "type": "step", "title": "Execute the change", "output": "Code and tests as components under their system, tagged, uncommitted; each task ticked in the record as it completes", "what": "The AI works through the plan's task list one task at a time, ticking each in the record as it is done, so an interruption resumes at the next unticked task. It writes the code and its tests inside the architecture rules and its never-do list, as components under the folder of the system they belong to (frontend, backend, service), reusing the components the plan named and tagging every touched piece with the id of each node it serves. For a retired node, code tagged only by retired nodes is removed.", "notes": "A PM \"stop\" that arrives during execution is honoured at the next task boundary.", "next": ["tasks-done"]}, {"id": "tasks-done", "type": "decision", "title": "All tasks done as planned?", "what": "Every task is ticked and was done as the plan said. A task that cannot be done as planned (a tool missing, an API different from the documentation, a component that turns out not to fit) stops the work; the AI does not improvise around the plan.", "notes": "When in doubt whether a deviation is within the plan, it is not; go back to plan.", "next": [{"to": "verify", "when": "all tasks done as planned"}, {"to": "plan", "when": "a task cannot be done as planned; the reason is written into the record"}, {"to": "drop", "when": "PM stopped the change"}]}, {"id": "verify", "type": "step", "title": "Verify against the acceptance criteria", "output": "Test results and a findings section, written into the record", "what": "The whole test suite runs, not only the touched nodes' tests, so a regression elsewhere is seen; a criterion with no test is a finding, so an empty suite never passes by default; a test that fails once and passes on rerun is reported as flaky, not counted as a failed pass. A second, independent AI pass checks the result against the confirmed acceptance criteria of every touched node, the architecture rules and its never-do list, and the sources the plan recorded; not against the plan itself. Untagged code and a component that duplicates another are findings.", "notes": "A verification that finds nothing on a change touching existing code is the most suspicious result in the system; it is run once more with a different framing (as the user trying to break it; as the owner of the untouched nodes) before it counts.", "next": ["passes"]}, {"id": "passes", "type": "decision", "title": "Verification passes?", "output": "The failed-pass count, kept in the record and reset whenever the record returns to plan", "what": "Every acceptance criterion holds and the reviewer has no open finding.", "notes": "When in doubt whether a finding is fixable in code, it goes back to plan; the loop never guesses towards \"pass\".", "next": [{"to": "execute", "when": "a finding is fixable in code, and fewer than three passes have failed"}, {"to": "plan", "when": "the plan itself was wrong, or three passes have failed; unfinished code is set aside"}, {"to": "accept", "when": "all criteria hold"}]}, {"id": "accept", "type": "decision", "title": "PM accepts the result?", "owner": "PM", "input": "The PM's own use of the changed flow, or, when it cannot be used (a background job, an event, a patch, a rule change touching no node), the evidence shown: test output, logs, a recorded run. Then the PM's answer: accept; not matching; changed mind about the logic; changed mind about the rule; or stop.", "output": "The answer, and for \"not matching\" what was seen, written into the record; on accept, a decision entry if acceptance settled anything the plan left open (it never supersedes; a conflict found here is a finding for the next plan)", "what": "The AI runs the product using the architecture file's run instructions and tells the PM, in plain language, where to go and what to try; where nothing can be tried, it shows the evidence instead. The PM judges against the approved node(s) and their criteria; for a rule delivery, against the evidence that every tagged piece still passes its criteria. \"Changed mind about the rule\" applies only to a rule record.", "next": [{"to": "commit", "when": "accepted"}, {"to": "plan", "when": "it does not match the approved logic although verification passed; the plan or its tasks were wrong"}, {"to": "back-to-define", "when": "seeing it changed the PM's mind about the logic"}, {"to": "back-to-foundation", "when": "seeing it changed the PM's mind about the rule"}, {"to": "drop", "when": "PM stops the change"}]}, {"id": "commit", "type": "step", "title": "Save code, tests and record together", "output": "One code commit: code, tests, the completed change record, the regenerated component index, each delivered node's status set to \"delivered\" with its version, a lesson appended to the decisions ledger if any, and an accepted rule if any", "what": "One commit holds the code, the tests and the completed change record, which names the version of each business node it delivers or, for a fix, the existing version the code now satisfies, plus the regenerated component index (component, system, nodes served). If the change was a proposed rule, the rule is written into the architecture file, as a new entry in its history, in the same commit, and the decision behind the old rule is marked superseded by the new one. Any lesson worth keeping (a pattern that worked, a trap avoided) is written as a decision entry of category process or code; it never supersedes an existing decision, and a conflict it finds becomes a finding for the next plan. The decision index is regenerated and must validate, or the commit does not happen. Waiting records on a node this delivers are re-sorted. \"What did we build for this logic\" then has one answer.", "next": ["was-rule"]}, {"id": "was-rule", "type": "decision", "title": "Was this a proposed rule?", "what": "A rule change was raised for a request. If that request still needs logic, it continues in Define; if the request was the rule itself, it is closed as delivered here.", "notes": "When in doubt, the request continues in Define; the PM can settle it there. For a large rule change split into several records, \"still needs logic\" is answered no until the last record is delivered.", "next": [{"to": "resume-define", "when": "yes, and the request still needs logic"}, {"to": "done", "when": "no (a node or a fix was delivered), or the request was the rule itself"}]}, {"id": "drop", "type": "step", "title": "Drop the change", "output": "Change record marked dropped (or, for a rule, \"rule dropped\"); node reverted or rule discarded; set-aside code discarded; a decision entry with the PM's reason for dropping, superseding every active decision written under this record", "what": "A node is returned to its last delivered version on the business side, or removed if it was never delivered; a proposed rule is discarded. Any request that depended on this one returns to waiting. The business side never claims behaviour or rules the product does not have.", "next": ["was-rule-drop"]}, {"id": "was-rule-drop", "type": "decision", "title": "Did a request need this rule?", "what": "A dropped rule must not silently drop the capability that asked for it: the request continues in Define, where the PM decides to go on within the current rules or to stop.", "next": [{"to": "resume-define", "when": "yes, the request still needs logic"}, {"to": "dropped", "when": "no, or the request was the rule itself"}]}, {"id": "back-to-define", "type": "handoff", "title": "Return to the business side", "output": "The record with the PM's revision, handed to Define", "what": "Any unfinished code is set aside. The business side is edited first, goes through challenge and PM approval again, and only then is a fresh plan written.", "to": "define.discuss", "next": ["returned"]}, {"id": "back-to-foundation", "type": "handoff", "title": "Return the rule to Foundation", "output": "The record with the PM's revision, handed to Foundation", "what": "Any unfinished code is set aside. The PM revises the proposed rule and it comes back for a fresh impact check and plan.", "to": "foundation.propose-rule", "next": ["returned"]}, {"id": "resume-define", "type": "handoff", "title": "Continue the request", "output": "The record, with the rule now applied or marked dropped, and the current architecture file, handed to Define", "what": "The request that needed the rule continues into discussion with the current architecture file and the glossary as inputs; if the rule was dropped, the discussion decides whether to go on within the current rules or stop.", "to": "define.discuss", "next": ["done"]}, {"id": "returned", "type": "end", "title": "Sent back for revision"}, {"id": "dropped", "type": "end", "title": "Change dropped"}, {"id": "done", "type": "end", "title": "Delivered"}]}, {"id": "foundation", "name": "Foundation", "owner": "PM", "purpose": "Fix the ground rules the system must build within: the architecture file and the glossary. Entered from Define, never directly.", "trigger": "Define sorts a request as needing the foundation, either because no architecture file exists yet or because the request needs a tool, language or rule the architecture does not allow", "steps": [{"id": "new-or-change", "type": "decision", "title": "New product or rule change?", "owner": "AI", "what": "Picks the case from the request's change record: no architecture file yet means a new product; otherwise one rule of an existing product must change and be checked against the code already built.", "notes": "Every step of this workflow writes its output to disk before the next step starts. When in doubt (a file exists but is empty or belongs to another product), the AI treats it as a rule change, never as a fresh start that could overwrite an existing file, and says so.", "next": [{"to": "architecture", "when": "new product, no architecture file yet"}, {"to": "propose-rule", "when": "rule change on an existing product"}]}, {"id": "architecture", "type": "step", "title": "Write the architecture file", "input": "The architecture file, written or pasted by the PM. On a later pass: the file revised for the findings, a finding marked \"accepted as is\", \"the foundation is not needed after all\", or \"stop\".", "output": "The file as written, and the PM's accepted findings, in the record", "what": "PM writes or pastes the architecture file. It must cover: the tools, language and resources the system builds with; the rules (including security, accessibility and performance rules, which are otherwise never checked); how the product is run; the systems the product has (frontends, backends, services) and the folder and component convention for each; the environments; where environment variables and secrets live and how the PM supplies them; and the things the system must never do (files never to touch, actions never to take). It is not generated by the system; it can be copied from elsewhere.", "next": ["check"]}, {"id": "check", "type": "decision", "title": "Architecture file complete and consistent?", "owner": "AI", "output": "Findings the PM must resolve, written into the record, if any; a decision entry for each finding the PM accepted as is", "what": "A second, independent AI pass reads the file for the required content above, internal contradictions, tools the AI cannot actually reach, and content that belongs to another product. Findings go back to the PM with the file; a finding the PM has marked \"accepted as is\" is not reported again and is logged as a decision with the PM's reason. The PM's \"not needed\" or \"stop\" is routed here.", "notes": "When in doubt whether something is a finding, it is reported; the PM can accept it as is. A check that finds nothing on a first-time file is run once more with a different framing (as the builder who must run it; as the reviewer looking for what is missing).", "next": [{"to": "architecture", "when": "findings the PM must resolve"}, {"to": "glossary", "when": "complete and consistent"}, {"to": "not-needed", "when": "PM says the foundation is not needed after all"}, {"to": "drop", "when": "PM stops"}]}, {"id": "glossary", "type": "step", "title": "Write the glossary", "input": "The product's terms, one meaning each, from the PM", "what": "PM lists the terms and things the product deals with, one meaning each, so every piece of business logic uses the same words. A later change to a term's meaning is a cross-cutting logic change, made in Define.", "next": ["save"]}, {"id": "save", "type": "step", "title": "Save the foundation", "owner": "AI", "output": "Architecture file and glossary, saved with history; one decision entry per rule that had an alternative (hosting, data store, auth, framework), category by what it governs", "what": "Architecture file and glossary are saved with their history. Every rule in the file that was chosen over an alternative becomes a decision entry with the PM's reason, so a later rule change brings the original reason forward; a rule with nothing weighed against it stays only in the file.", "next": ["foundation-only"]}, {"id": "foundation-only", "type": "decision", "title": "Was the request the foundation itself?", "owner": "AI", "what": "The very first request of a product is often \"here is the architecture\"; then there is nothing to discuss and the record is closed as delivered. Otherwise the request that needed the foundation continues.", "next": [{"to": "done", "when": "the request was the foundation itself"}, {"to": "ready", "when": "the request still needs logic"}]}, {"id": "ready", "type": "handoff", "title": "Return to the discussion", "output": "The record, the architecture file and the glossary, handed to Define", "what": "The discussion continues with these as its inputs.", "to": "define.discuss", "next": ["done"]}, {"id": "propose-rule", "type": "step", "title": "Propose the changed rule", "input": "The changed rule, written by the PM. On a later pass: the rule revised for the findings, a finding marked \"accepted as is\", \"not needed after all\", or \"stop\".", "output": "A proposed rule, unsaved, written into the record, alongside the active decision it would alter", "what": "PM writes the changed rule. Before anything else the AI brings forward the active decision behind the current rule: its situation, decision and reasons, side by side with the proposal. It is a proposal, not yet part of the architecture file: it is written into the file only when the delivery that satisfies it is accepted, and discarded if that delivery is dropped.", "next": ["check-rule"]}, {"id": "check-rule", "type": "decision", "title": "Proposed rule consistent with the file?", "owner": "AI", "output": "Findings the PM must resolve, written into the record, if any", "what": "A second, independent AI pass checks the proposal against the rest of the architecture file: contradictions, tools the AI cannot reach, required content it would remove. A finding the PM has marked \"accepted as is\" is not reported again. The PM's \"not needed\" or \"stop\" is routed here.", "notes": "When in doubt whether something is a finding, it is reported. A check that finds nothing on a rule that touches existing code is run once more with a different framing.", "next": [{"to": "propose-rule", "when": "findings the PM must resolve"}, {"to": "impact", "when": "consistent"}, {"to": "not-needed", "when": "PM says the rule is not needed after all"}, {"to": "drop", "when": "PM stops"}]}, {"id": "impact", "type": "handoff", "title": "Send the proposal for an impact check", "output": "The proposed rule in the record, handed to Deliver", "what": "Delivery finds every piece of code the rule touches and returns a plain-language plan; the PM decides there whether to apply the rule, revise it, or drop it. Once applied, or if it is dropped, the record continues in Define.", "to": "deliver.trace", "next": ["done"]}, {"id": "not-needed", "type": "handoff", "title": "Continue without a foundation change", "output": "The record, unchanged foundation, handed back to Define", "what": "The discussion continues within the current rules.", "to": "define.discuss", "next": ["done"]}, {"id": "drop", "type": "step", "title": "Drop the request", "owner": "AI", "output": "Change record marked dropped; unsaved file or proposal discarded; dependants returned to waiting", "what": "Nothing was saved; the record is closed as dropped.", "next": ["dropped"]}, {"id": "dropped", "type": "end", "title": "Request dropped"}, {"id": "done", "type": "end", "title": "Foundation handled"}]}]}</script>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const DATA=JSON.parse($('#data').textContent);
  const groups=DATA.map.groups||[], wfDocs=DATA.workflows||[];
  const WF={}; wfDocs.forEach(w=>WF[w.id]=w);
  const state={mode:'map',wf:null,sel:null};

  // ---------- helpers ----------
  const targets=s=>(s.next||[]).map(t=>typeof t==='string'?{to:t}:t);
  const handoffsOf=w=>(w.steps||[]).filter(s=>s.type==='handoff'&&s.to);
  const inbound=wid=>wfDocs.flatMap(w=>handoffsOf(w).filter(h=>h.to.split('.')[0]===wid).map(h=>({from:w,step:h})));
  function wrap(text,max){const words=String(text).split(/\s+/),lines=[];let cur='';for(const w of words){if((cur+' '+w).trim().length>max&&cur){lines.push(cur);cur=w}else cur=(cur+' '+w).trim()}if(cur)lines.push(cur);return lines}

  // ---------- layered layout (top-to-bottom) ----------
  // nodes: [{id,w,h}], edges: [{from,to,label}] -> {nodes with x,y (centers), edges with back:bool, width, height}
  function layout(nodes,edges,opt){
    const NS=opt.nodesep||36, RS=opt.ranksep||76;
    const byId={};nodes.forEach(n=>byId[n.id]=n);
    const out={};nodes.forEach(n=>out[n.id]=[]);edges.forEach(e=>{if(byId[e.from]&&byId[e.to])out[e.from].push(e)});
    // back edges via DFS from the first node, then from any unvisited
    const color={};edges.forEach(e=>e.back=false);
    function dfs(u){color[u]=1;for(const e of out[u]){if(color[e.to]===1)e.back=true;else if(!color[e.to])dfs(e.to)}color[u]=2}
    nodes.forEach(n=>{if(!color[n.id])dfs(n.id)});
    // ranks = longest path over forward edges
    const rank={};nodes.forEach(n=>rank[n.id]=0);
    let changed=true,guard=0;while(changed&&guard++<nodes.length+2){changed=false;edges.forEach(e=>{if(!e.back&&byId[e.from]&&byId[e.to]&&rank[e.to]<rank[e.from]+1){rank[e.to]=rank[e.from]+1;changed=true}})}
    // end states all sit on the bottom row
    const sinks=nodes.filter(n=>n.sink),nonSink=nodes.filter(n=>!n.sink);
    if(sinks.length&&nonSink.length){const bottom=Math.max(...nonSink.map(n=>rank[n.id]))+1;sinks.forEach(n=>rank[n.id]=bottom)}
    const R=Math.max(-1,...nodes.map(n=>rank[n.id]))+1;const rows=Array.from({length:R},()=>[]);
    nodes.forEach(n=>rows[rank[n.id]].push(n.id));
    // barycenter ordering, a few sweeps
    const pos={};rows.forEach(r=>r.forEach((id,i)=>pos[id]=i));
    const preds={},succs={};nodes.forEach(n=>{preds[n.id]=[];succs[n.id]=[]});edges.forEach(e=>{if(!e.back&&byId[e.from]&&byId[e.to]){preds[e.to].push(e.from);succs[e.from].push(e.to)}});
    const bary=(id,ns)=>ns.length?ns.reduce((a,b)=>a+pos[b],0)/ns.length:pos[id];
    for(let s=0;s<4;s++){for(let r=1;r<R;r++){rows[r].sort((a,b)=>bary(a,preds[a])-bary(b,preds[b]));rows[r].forEach((id,i)=>pos[id]=i)}
      for(let r=R-2;r>=0;r--){rows[r].sort((a,b)=>bary(a,succs[a])-bary(b,succs[b]));rows[r].forEach((id,i)=>pos[id]=i)}}
    // coordinates
    const rowW=rows.map(r=>r.reduce((a,id)=>a+byId[id].w,0)+NS*(r.length-1));const W=Math.max(0,...rowW);
    let y=0;const rowH=[];rows.forEach((r,ri)=>{const h=Math.max(0,...r.map(id=>byId[id].h));rowH.push(h);let x=(W-rowW[ri])/2;r.forEach(id=>{const n=byId[id];n.x=x+n.w/2;n.y=y+h/2;x+=n.w+NS});y+=h+RS});
    nodes.forEach(n=>n.rank=rank[n.id]);
    return {width:W,height:Math.max(0,y-RS)};
  }
  // edge path (TB). Adjacent rows: a direct curve, bottom→top. Jumps of 2+ rows: routed down the
  // left margin; loops back up: routed up the right margin. Each side edge gets its own lane.
  function edgePath(a,b,kind,W,lane){
    if(a===b){const x=a.x+a.w/2,y=a.y;return {d:`M${x},${y-10} C${x+50},${y-30} ${x+50},${y+30} ${x},${y+10}`,lx:x+40,ly:y,anchor:'start'}}
    if(kind==='direct'){const x1=a.x,y1=a.y+a.h/2,x2=b.x,y2=b.y-b.h/2;const my=(y1+y2)/2;
      // label beside the curve's midpoint, on the outer side of the fan, so edges leaving one decision
      // (or entering one step) do not print on top of each other or over the neighbouring node
      const px=(x1+x2)/2,py=(y1+y2)/2,left=x2<x1;return {d:`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`,lx:left?px-6:px+6,ly:py+4,anchor:left?'end':'start'}}
    const r=10,yt=b.y-b.h/2,yin=yt-22;   // side rails come back in above the target and drop into its top
    if(kind==='jump'){const xl=-40-lane*26;const x1=a.x-a.w/2,y1=a.y;
      return {d:`M${x1},${y1} H${xl+r} Q${xl},${y1} ${xl},${y1+r} V${yin-r} Q${xl},${yin} ${xl+r},${yin} H${b.x-r} Q${b.x},${yin} ${b.x},${yin+r} V${yt}`,lx:xl-6,ly:(y1+yin)/2,anchor:'end'}}
    const xr=W+40+lane*26;const x1=a.x+a.w/2,y1=a.y;
    return {d:`M${x1},${y1} H${xr-r} Q${xr},${y1} ${xr},${y1-r} V${yin+r} Q${xr},${yin} ${xr-r},${yin} H${b.x+r} Q${b.x},${yin} ${b.x},${yin+r} V${yt}`,lx:xr+6,ly:(y1+yin)/2,anchor:'start'}
  }

  // ---------- nav ----------
  function renderNav(){
    const n=$('#nav'); n.innerHTML='';
    if(!wfDocs.length){n.innerHTML='<div class="empty">No workflows yet. Add one under <span class="mono">workflows/</span>, list it in <span class="mono">map.yaml</span>, run validate and build.</div>';return}
    groups.forEach(g=>{
      const h=document.createElement('div');h.className='g';h.textContent=g.name;n.appendChild(h);
      (g.workflows||[]).forEach(id=>{const w=WF[id];if(!w)return;
        const b=document.createElement('button');b.className='wf'+(state.mode==='wf'&&state.wf===id?' active':'');
        b.innerHTML=`${esc(w.name)}<small>${(w.steps||[]).length} steps · ${esc(w.owner)}</small>`;
        b.onclick=()=>openWf(id);n.appendChild(b)});
    });
  }

  // ---------- canvas plumbing ----------
  const svg=$('#canvas'),view=$('#view');let vb={x:0,y:0,w:1000,h:700};
  function setVB(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
  function fit(gw,gh){const r=svg.getBoundingClientRect(),pad=70;if(!r.width||!r.height)return;
    const lg=$('#legend'),lgH=lg&&!lg.hidden?lg.getBoundingClientRect().height+24:0;   // the legend overlays the bottom-left: keep the drawing above it
    const s=Math.min(r.width/(gw+pad*2),(r.height-lgH)/(gh+pad*2),1.3);vb={w:r.width/s,h:r.height/s,x:0,y:0};vb.x=-(vb.w-gw)/2;vb.y=-((r.height-lgH)/s-gh)/2;setVB()}
  let drag=null;
  svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};svg.setPointerCapture(e.pointerId)});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect(),k=vb.w/r.width;vb.x=drag.vx-(e.clientX-drag.x)*k;vb.y=drag.vy-(e.clientY-drag.y)*k;setVB()});
  svg.addEventListener('pointerup',()=>drag=null);
  svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();const mx=vb.x+(e.clientX-r.left)/r.width*vb.w,my=vb.y+(e.clientY-r.top)/r.height*vb.h;const f=Math.exp(e.deltaY*0.0015);vb={x:mx-(mx-vb.x)*f,y:my-(my-vb.y)*f,w:vb.w*f,h:vb.h*f};setVB()},{passive:false});
  const NS='http://www.w3.org/2000/svg';const el=(t,a={})=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n};
  let lastSize={w:0,h:0};

  // ---------- single workflow ----------
  const badgePairs=(s,entry)=>{const b=[];if(s.id===entry)b.push(['entry','ENTRY']);if(s.type==='end'||s.type==='handoff')b.push(['exit',s.type==='handoff'?'EXIT → '+s.to.split('.')[0].toUpperCase():'EXIT']);if(s.input)b.push(['pm','PM INPUT']);if(s.output)b.push(['out','OUTPUT']);return b};
  const badgeLabels=(s,entry)=>badgePairs(s,entry).map(x=>x[1]);
  function openWf(id,sel){state.mode='wf';state.wf=id;state.sel=sel||null;draw();}
  function drawWf(w){
    const steps=w.steps||[];
    const nodes=steps.map(s=>{const lines=wrap(s.title,22);const isD=s.type==='decision';const tw=Math.max(...lines.map(l=>l.length));
      const idw=s.type==='handoff'?(s.to.length+2)*6.6+16:0;
      // the badge row (ENTRY / EXIT → X / PM INPUT / OUTPUT) must fit inside the node's width
      const bl=badgeLabels(s,steps[0]&&steps[0].id),bw=bl.reduce((a,l)=>a+l.length*6.2+14,0)+8;
      return {id:s.id,s,lines,sink:s.type==='end',w:isD?Math.max(170,tw*8.5+70,bw):Math.max(150,tw*7.4+40,idw,bw),h:isD?76:(30+lines.length*16+(s.type==='handoff'?6:0))}});
    // parallel branches to the same step are drawn once, conditions joined with ' / '
    const edges=[],seenPair={};steps.forEach(s=>targets(s).forEach(t=>{const k=s.id+'>'+t.to;if(seenPair[k]){if(t.when)seenPair[k].label+=(seenPair[k].label?' / ':'')+t.when;return}edges.push(seenPair[k]={from:s.id,to:t.to,label:t.when||''})}));
    let size=layout(nodes,edges,{});const N={};nodes.forEach(n=>N[n.id]=n);
    // a band between two ranks holds one 14px row per label that must not overlap; when many labelled
    // edges fan out between the same two ranks (two decisions side by side), open the rank gap to fit them
    {const per={};edges.forEach(e=>{const a=N[e.from],b=N[e.to];if(a&&b&&e.label&&b.rank-a.rank===1)per[a.rank]=(per[a.rank]||0)+1});
      const most=Math.max(0,...Object.values(per));if(most>3)size=layout(nodes,edges,{ranksep:76+(most-3)*14})}
    view.innerHTML='';
    // labels of side rails sit outside the outermost rail on that side
    const kindOf=e=>{const a=N[e.from],b=N[e.to];return (!a||!b)?null:e.back?'back':(b.rank-a.rank>1?'jump':'direct')};
    const nJ=edges.filter(e=>kindOf(e)==='jump').length,nB=edges.filter(e=>kindOf(e)==='back').length;
    let jumps=0,backs=0;const labels=[];
    edges.forEach(e=>{const a=N[e.from],b=N[e.to];const kind=kindOf(e);if(!kind)return;
      const p=edgePath(a,b,kind,size.width,kind==='jump'?jumps++:kind==='back'?backs++:0);
      if(kind==='jump')p.lx=-40-(nJ-1)*26-8;if(kind==='back')p.lx=size.width+40+(nB-1)*26+8;
      const ge=el('g',{class:'edge'});ge.appendChild(el('path',{d:p.d,'marker-end':'url(#arrow)'}));
      if(e.label){const t=el('text',{x:p.lx,y:p.ly,'text-anchor':p.anchor});t.textContent=e.label.length>44?e.label.slice(0,42).trimEnd()+'…':e.label;const tt=el('title');tt.textContent=e.label;t.appendChild(tt);ge.appendChild(t);const dir=kind==='direct';labels.push({t,x:p.lx,y:p.ly,w:0,anchor:p.anchor,minY:dir?a.y+a.h/2+8:-1e9,maxY:dir?b.y-b.h/2-22:1e9})}view.appendChild(ge)});
    // labels that would still print over one another are pushed down until they clear (14px per line)
    // (a label stays between its own source and target: if there is no room below, the other one moves up)
    labels.forEach(l=>{try{l.w=l.t.getComputedTextLength()+8}catch(_){l.w=l.t.textContent.length*6.8+8}});
    labels.sort((a,b)=>a.y-b.y);for(let pass=0;pass<4;pass++)for(let i=0;i<labels.length;i++)for(let j=i+1;j<labels.length;j++){const a=labels[i],b=labels[j];
      const ax0=a.anchor==='end'?a.x-a.w:a.x,bx0=b.anchor==='end'?b.x-b.w:b.x;if(ax0<bx0+b.w&&bx0<ax0+a.w&&Math.abs(a.y-b.y)<14){
        if(a.y+14<=b.maxY){b.y=a.y+14;b.t.setAttribute('y',b.y)}else if(b.y-14>=a.minY){a.y=b.y-14;a.t.setAttribute('y',a.y)}}}
    const entry=steps[0]&&steps[0].id;
    nodes.forEach(n=>{const s=n.s;const gn=el('g',{class:`node ${s.type}${s.id===entry?' entry':''}${state.sel===s.id?' selected':''}`,transform:`translate(${n.x-n.w/2},${n.y-n.h/2})`});
      if(s.type==='decision')gn.appendChild(el('polygon',{points:`${n.w/2},0 ${n.w},${n.h/2} ${n.w/2},${n.h} 0,${n.h/2}`}));
      else gn.appendChild(el('rect',{width:n.w,height:n.h,rx:s.type==='end'?n.h/2:6}));
      const isD=s.type==='decision',base=isD?n.h/2:(n.h/2-(s.type==='end'?0:6));
      n.lines.forEach((l,i)=>{const t=el('text',{x:n.w/2,y:base-((n.lines.length-1)*8)+i*16,'text-anchor':'middle','dominant-baseline':'middle'});t.textContent=l;gn.appendChild(t)});
      if(s.type==='step'||s.type==='handoff'){const t=el('text',{class:'id',x:8,y:n.h-6});t.textContent=s.type==='handoff'?'→ '+s.to:s.id;gn.appendChild(t)}
      const pmOwned=(s.owner||w.owner)==='PM';if(pmOwned)gn.classList.add('pmowned');
      const badges=badgePairs(s,entry);
      let bx=s.type==='decision'?n.w/2-badges.reduce((a,b)=>a+b[1].length*6.2+14,0)/2:6;badges.forEach(([c,l])=>{const bw=l.length*6.2+10;const g=el('g',{class:'badge '+c,transform:`translate(${bx},${-9})`});g.appendChild(el('rect',{width:bw,height:14}));const t=el('text',{x:bw/2,y:7.5});t.textContent=l;g.appendChild(t);gn.appendChild(g);bx+=bw+4});
      gn.onclick=()=>{state.sel=s.id;draw(false)};view.appendChild(gn)});
    const margL=jumps?40+jumps*26+200:0,margR=backs?40+backs*26+200:0;
    view.setAttribute('transform',`translate(${margL},0)`);
    lastSize={w:size.width+margL+margR,h:size.height};
    inspectStep(w,steps.find(s=>s.id===state.sel));
    $('#crumb').innerHTML=`<b>${esc(w.name)}</b> &nbsp;·&nbsp; ${esc(w.owner)} &nbsp;·&nbsp; <span class="mono">workflows/${esc(w.id)}.yaml</span>`;
  }

  // ---------- map: groups as columns, workflows stacked, handoffs as curves ----------
  function drawMap(){
    const COLW=230,BOXH=58,GAPX=190,GAPY=22,PAD=18,TERMW=150,TERMH=44;
    const entryRef=(DATA.map.entry||'').split('.'),exitRef=(DATA.map.exit||'').split('.');
    const N={};let x=0,maxH=0;const cols=[];
    groups.forEach(g=>{const ids=(g.workflows||[]).filter(id=>WF[id]);let y=PAD+22;ids.forEach(id=>{N[id]={x:x+PAD,y,w:COLW-PAD*2,h:BOXH,cx:x+COLW/2,cy:y+BOXH/2};y+=BOXH+GAPY});const h=Math.max(y-GAPY+PAD,90);cols.push({g,x,h});maxH=Math.max(maxH,h);x+=COLW+GAPX});
    const W=Math.max(0,x-GAPX)+GAPX+TERMW;let bottomM=0;view.innerHTML='';
    cols.forEach(c=>{const gc=el('g',{class:'cluster'});gc.appendChild(el('rect',{x:c.x,y:0,width:COLW,height:maxH}));const t=el('text',{x:c.x+PAD,y:20});t.textContent=c.g.name;gc.appendChild(t);view.appendChild(gc)});
    const pairs={},pairT={};wfDocs.forEach(w=>handoffsOf(w).forEach(h=>{const to=h.to.split('.')[0];if(!N[to]||!N[w.id])return;const k=w.id+'>'+to;pairs[k]=(pairs[k]||0)+1;(pairT[k]=pairT[k]||[]).push(h.title)}));
    const colOf={};cols.forEach((c,i)=>(c.g.workflows||[]).forEach(id=>colOf[id]=i));
    let topLane=0;
    Object.entries(pairs).forEach(([k,c])=>{const [ai,bi]=k.split('>'),a=N[ai],b=N[bi];const ge=el('g',{class:'edge hand'});let d,lx,ly;
      const twoWay=!!pairs[bi+'>'+ai];const dy=twoWay?(ai<bi?-9:9):0;   // two-way links: one above, one below the centre line
      const dc=colOf[bi]-colOf[ai];
      if(dc===0){const xr=a.x+a.w+28;d=`M${a.x+a.w},${a.cy+dy} C${xr},${a.cy+dy} ${xr},${b.cy+dy} ${b.x+b.w},${b.cy+dy}`;lx=xr+4;ly=(a.cy+b.cy)/2}
      else if(Math.abs(dc)>1){const yl=-28-(topLane++)*18;const r=10,dx=twoWay?(ai<bi?-10:10):0,x1=a.cx+dx,x2=b.cx+dx;   // non-adjacent columns: over the top
        d=`M${x1},${a.y} V${yl+r} Q${x1},${yl} ${x1+(x2>x1?r:-r)},${yl} H${x2-(x2>x1?r:-r)} Q${x2},${yl} ${x2},${yl+r} V${b.y}`;lx=(x1+x2)/2;ly=yl-5}
      else{const fwd=dc>0;const x1=fwd?a.x+a.w:a.x,x2=fwd?b.x:b.x+b.w;const mx=(x1+x2)/2;d=`M${x1},${a.cy+dy} C${mx},${a.cy+dy} ${mx},${b.cy+dy} ${x2},${b.cy+dy}`;lx=mx;ly=(a.cy+b.cy)/2+dy+(dy>0?16:-8)}
      ge.appendChild(el('path',{d,'marker-end':'url(#arrowh)'}));const titles=pairT[k];const t=el('text',{x:lx,y:ly,'text-anchor':'middle'});
      titles.forEach((tt,i)=>{const sp=el('tspan',{x:lx,dy:i===0?(dy>0?0:-(titles.length-1)*13):13});sp.textContent=tt;t.appendChild(sp)});ge.appendChild(t);view.appendChild(ge)});
    // PM source → system entry; system exit → result terminal
    const eN=N[entryRef[0]],xN=N[exitRef[0]];
    if(eN){const ew=WF[entryRef[0]],es=(ew.steps||[]).find(st=>st.id===entryRef[1]);const tx=eN.cx-TERMW/2,ty=maxH+70;bottomM=70+TERMH+10;
      const g=el('g',{class:'term entry'});g.appendChild(el('rect',{x:tx,y:ty,width:TERMW,height:TERMH}));const t=el('text',{x:tx+TERMW/2,y:ty+15});t.textContent='PM';g.appendChild(t);const u=el('text',{class:'sub',x:tx+TERMW/2,y:ty+31});u.textContent='idea · request · change';g.appendChild(u);view.appendChild(g);
      const ge=el('g',{class:'edge io'});ge.appendChild(el('path',{d:`M${eN.cx},${ty} V${eN.y+eN.h}`,'marker-end':'url(#arrowpm)'}));const l=el('text',{x:eN.cx+8,y:(ty+eN.y+eN.h)/2+4,'text-anchor':'start'});l.textContent='ENTRY · '+(es?es.title:entryRef[1]);ge.appendChild(l);view.appendChild(ge)}
    if(xN){const xw=WF[exitRef[0]],xs=(xw.steps||[]).find(st=>st.id===exitRef[1]);const tx=xN.x+xN.w+GAPX,ty=xN.cy-TERMH/2;
      const g=el('g',{class:'term exit'});g.appendChild(el('rect',{x:tx,y:ty,width:TERMW,height:TERMH}));const t=el('text',{x:tx+TERMW/2,y:ty+15});t.textContent='RESULT';g.appendChild(t);const u=el('text',{class:'sub',x:tx+TERMW/2,y:ty+31});u.textContent=xs?xs.title:exitRef[1];g.appendChild(u);view.appendChild(g);
      const ge=el('g',{class:'edge io exit'});ge.appendChild(el('path',{d:`M${xN.x+xN.w},${xN.cy} H${tx}`,'marker-end':'url(#arrowend)'}));const l=el('text',{x:(xN.x+xN.w+tx)/2,y:xN.cy-7,'text-anchor':'middle'});l.textContent='EXIT';ge.appendChild(l);view.appendChild(ge)}
    wfDocs.forEach(w=>{const n=N[w.id];if(!n)return;const gn=el('g',{class:'node wf'+(state.sel===w.id?' selected':''),transform:`translate(${n.x},${n.y})`});gn.appendChild(el('rect',{width:n.w,height:n.h,rx:8}));
      const t=el('text',{class:'n',x:14,y:24});t.textContent=w.name;gn.appendChild(t);const s=el('text',{class:'sub',x:14,y:43});const nIn=(w.steps||[]).filter(st=>st.input).length;s.textContent=`${(w.steps||[]).length} steps · ${w.owner} · PM input ×${nIn}`;gn.appendChild(s);
      const badges=[];if(w.id===entryRef[0])badges.push(['entry','ENTRY']);if(w.id===exitRef[0])badges.push(['exit','EXIT']);let bx=6;badges.forEach(([c,l])=>{const bw=l.length*6.2+10;const g=el('g',{class:'badge '+c,transform:`translate(${bx},-9)`});g.appendChild(el('rect',{width:bw,height:14}));const tt=el('text',{x:bw/2,y:7.5});tt.textContent=l;g.appendChild(tt);gn.appendChild(g);bx+=bw+4});
      gn.onclick=()=>{state.sel=w.id;draw(false)};gn.ondblclick=()=>openWf(w.id);view.appendChild(gn)});
    const topM=topLane?28+topLane*18+10:0;view.setAttribute('transform',`translate(0,${topM})`);
    lastSize={w:W,h:maxH+topM+bottomM};
    inspectWf(WF[state.sel]);
    $('#crumb').innerHTML=`<b>All workflows</b> &nbsp;·&nbsp; ${wfDocs.length} workflow${wfDocs.length===1?'':'s'} in ${groups.length} group${groups.length===1?'':'s'}`;
  }

  // ---------- inspector ----------
  function inspectStep(w,s){const a=$('#inspector');
    if(!s){const exits=w.steps.filter(x=>x.type==='end'||x.type==='handoff').map(x=>`<li><a data-step="${esc(x.id)}">${esc(x.title)}</a>${x.type==='handoff'?` <span class="muted">→ ${esc(x.to)}</span>`:''}</li>`).join('');
      const ins=w.steps.filter(x=>x.input).map(x=>`<li><a data-step="${esc(x.id)}">${esc(x.title)}</a> <span class="muted">· ${esc(x.input)}</span></li>`).join('');
      a.innerHTML=`<h2>${esc(w.name)}</h2><span class="tag step">workflow · owner ${esc(w.owner)}</span><dl><div><dt>Purpose</dt><dd>${esc(w.purpose)}</dd></div><div><dt>Trigger</dt><dd>${esc(w.trigger)}</dd></div><div><dt>Entry</dt><dd><a data-step="${esc(w.steps[0].id)}">${esc(w.steps[0].title)}</a></dd></div><div><dt>Exits</dt><dd><ul>${exits}</ul></dd></div><div><dt>Where the PM provides input</dt><dd><ul>${ins||'<li class="muted">none</li>'}</ul></dd></div>${inboundList(w.id)}</dl>`;bind(a,w);return}
    const outs=targets(s).map(t=>`<li><a data-step="${esc(t.to)}">${esc((w.steps.find(x=>x.id===t.to)||{}).title||t.to)}</a>${t.when?` <span class="muted">— when ${esc(t.when)}</span>`:''}</li>`).join('');
    const ho=s.type==='handoff'?`<div><dt>Hands off to</dt><dd><a data-wf="${esc(s.to.split('.')[0])}" data-step="${esc(s.to.split('.')[1])}">${esc(s.to)}</a></dd></div>`:'';
    const lbls=[s.id===w.steps[0].id?'entry':'',(s.type==='end'||s.type==='handoff')?'exit':''].filter(Boolean).map(x=>` · ${x}`).join('');
    a.innerHTML=`<h2>${esc(s.title)}</h2><span class="tag ${s.type}">${s.type}${lbls} · owner ${esc(s.owner||w.owner)}</span><dl>
      ${s.input?`<div><dt>PM provides</dt><dd>${esc(s.input)}</dd></div>`:''}
      <div><dt>What happens</dt><dd>${esc(s.what||'—')}</dd></div>
      ${s.output?`<div><dt>Produces</dt><dd>${esc(s.output)}</dd></div>`:''}
      ${s.owner?`<div><dt>Owner</dt><dd>${esc(s.owner)}</dd></div>`:''}
      ${s.notes?`<div><dt>Notes</dt><dd class="notes">${esc(s.notes)}</dd></div>`:''}
      ${ho}
      ${outs?`<div><dt>Then</dt><dd><ul>${outs}</ul></dd></div>`:''}
      <div><dt>Id</dt><dd class="mono muted">${esc(w.id)}.${esc(s.id)}</dd></div></dl>`;
    bind(a,w);
  }
  function bind(a,w){a.querySelectorAll('a[data-step]').forEach(l=>l.onclick=()=>openWf(l.dataset.wf||(w&&w.id),l.dataset.step));a.querySelectorAll('a[data-open]').forEach(l=>l.onclick=()=>openWf(l.dataset.open))}
  function inboundList(wid){const inb=inbound(wid);if(!inb.length)return'';return`<div><dt>Receives handoffs from</dt><dd><ul>${inb.map(i=>`<li><a data-wf="${esc(i.from.id)}" data-step="${esc(i.step.id)}">${esc(i.from.name)}</a> <span class="muted">· ${esc(i.step.title)}</span></li>`).join('')}</ul></dd></div>`}
  function inspectWf(w){const a=$('#inspector');
    if(!w){const e=DATA.map.entry||'—',x=DATA.map.exit||'—';a.innerHTML=wfDocs.length?`<h2>Map</h2><dl><div><dt>System entry</dt><dd>The PM's idea, request or change enters at <span class="mono">${esc(e)}</span>.</dd></div><div><dt>System exit</dt><dd>The finished result leaves at <span class="mono">${esc(x)}</span>.</dd></div><div><dd class="muted">Each column is a group, each box one workflow with its count of PM-input steps; dashed arrows are handoffs, named by the step they leave from. Click a workflow for its summary, double-click to open it.</dd></div></dl>`:`<h2>Nothing here yet</h2><dl><div><dd class="muted">The map fills in as workflow files are added.</dd></div></dl>`;return}
    const outs=handoffsOf(w).map(h=>`<li><a data-wf="${esc(h.to.split('.')[0])}" data-step="${esc(h.to.split('.')[1])}">${esc((WF[h.to.split('.')[0]]||{}).name||h.to)}</a> <span class="muted">· ${esc(h.title)}</span></li>`).join('');
    a.innerHTML=`<h2>${esc(w.name)}</h2><span class="tag step">workflow</span><dl><div><dt>Purpose</dt><dd>${esc(w.purpose)}</dd></div><div><dt>Trigger</dt><dd>${esc(w.trigger)}</dd></div><div><dt>Owner</dt><dd>${esc(w.owner)}</dd></div>
      ${outs?`<div><dt>Hands off to</dt><dd><ul>${outs}</ul></dd></div>`:''}${inboundList(w.id)}
      <div><dd><a data-open="${esc(w.id)}">Open workflow →</a></dd></div></dl>`;
    bind(a,w);
  }

  // ---------- draw ----------
  function draw(refit=true){
    renderNav();
    $('#legend').hidden=false;
    const hint=$('#hint');
    if(!wfDocs.length){view.innerHTML='';hint.hidden=false;hint.innerHTML='<div><b>No workflows yet.</b><br>The map and the workflow views appear once the first file lands in <span class="mono">workflows/</span>.</div>';inspectWf(null);$('#crumb').innerHTML='<b>All workflows</b> · 0';return}
    hint.hidden=true;
    if(state.mode==='wf'&&WF[state.wf])drawWf(WF[state.wf]);else{state.mode='map';drawMap()}
    if(refit)fit(lastSize.w,lastSize.h);
  }
  const defs=el('defs');defs.innerHTML='<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker><marker id="arrowpm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pm)"/></marker><marker id="arrowend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--end)"/></marker><marker id="arrowh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--handoff)"/></marker>';svg.insertBefore(defs,view);
  $('#btnMap').onclick=()=>{state.mode='map';state.sel=null;draw()};
  $('#btnFit').onclick=()=>fit(lastSize.w,lastSize.h);
  window.addEventListener('resize',()=>fit(lastSize.w,lastSize.h));
  draw();
})();
</script>

</body>
